<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주문 요청 등록 테스트</title>
</head>

<body>

<!-- 주문 요청 등록 API의 동작을 브라우저에서 확인하기 위한 테스트 페이지 -->

<h1>주문 요청 등록 테스트</h1>

<form id="orderRequestForm">

    <div>
        <label for="eventDateTime">행사/배송 일시</label>
        <input type="datetime-local" id="eventDateTime" required>
    </div>

    <div>
        <label for="quantity">수량</label>
        <input type="number" id="quantity" min="1" required>
    </div>

    <div>
        <label for="budgetType">예산 기준</label>
        <select id="budgetType" required>
            <option value="PER_PERSON">1인당 예산</option>
            <option value="TOTAL">총 예산</option>
        </select>
    </div>

    <div>
        <label for="budget">예산</label>
        <input type="number" id="budget" min="1" required>
    </div>

    <div>
        <label for="category">음식 카테고리</label>
        <input type="text" id="category" required>
    </div>

    <div>
        <label for="deliveryAddress">배송지</label>
        <input type="text" id="deliveryAddress" required>
    </div>

    <!-- 주소 API 연동 전까지 사용하는 테스트용 좌표 -->
    <div>
        <label for="latitude">위도 (테스트용)</label>
        <input type="number" step="any" id="latitude" value="37.501" required>
    </div>

    <div>
        <label for="longitude">경도 (테스트용)</label>
        <input type="number" step="any" id="longitude" value="127.039" required>
    </div>

    <button type="submit">주문 요청 등록</button>

</form>

<h2>응답 결과</h2>
<pre id="result"></pre>

<script>
    const form = document.getElementById("orderRequestForm");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const requestData = {
            eventDateTime: document.getElementById("eventDateTime").value,
            quantity: Number(document.getElementById("quantity").value),
            budgetType: document.getElementById("budgetType").value,
            budget: Number(document.getElementById("budget").value),
            category: document.getElementById("category").value,
            deliveryAddress: document.getElementById("deliveryAddress").value,
            latitude: Number(document.getElementById("latitude").value),
            longitude: Number(document.getElementById("longitude").value)
        };

        const response = await fetch("/api/v1/requests", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(requestData)
        });

        const data = await response.json();

        result.textContent = JSON.stringify(data, null, 2);
    });
</script>

</body>
</html>
