<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>판매 조건 전체 목록 테스트</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        tr:hover {
            background-color: #f9f9f9;
        }
        .btn {
            padding: 5px 10px;
            text-decoration: none;
            background-color: #007bff;
            color: white;
            border-radius: 3px;
            font-size: 14px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .nav {
            margin-bottom: 20px;
        }
        .nav a {
            margin-right: 15px;
            text-decoration: none;
            color: #28a745;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>판매 조건 전체 목록 테스트</h1>

<div class="nav">
    <a href="/products-test.html">➕ 새 판매 조건 등록 테스트 페이지로 이동</a>
    <a href="/products-update-test.html">✏️ 판매 조건 수정 테스트 페이지로 이동</a>
</div>

<button id="refreshBtn">목록 새로고침</button>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>최소 수주 수량</th>
        <th>최대 수주 수량</th>
        <th>최소 주문 금액</th>
        <th>배송 반경 (km)</th>
        <th>가게 주소</th>
        <th>음식 카테고리</th>
        <th>평점</th>
        <th>최종 수정일</th>
        <th>관리</th>
    </tr>
    </thead>
    <tbody id="productList">
    <tr>
        <td colspan="10" style="text-align: center;">데이터를 불러오는 중입니다...</td>
    </tr>
    </tbody>
</table>

<script>
    const productList = document.getElementById("productList");
    const refreshBtn = document.getElementById("refreshBtn");

    async function fetchProducts() {
        try {
            productList.innerHTML = '<tr><td colspan="10" style="text-align: center;">데이터를 불러오는 중입니다...</td></tr>';
            const response = await fetch("/api/v1/products");
            if (!response.ok) {
                throw new Error("데이터를 불러오는 데 실패했습니다.");
            }
            const data = await response.json();
            
            if (data.length === 0) {
                productList.innerHTML = '<tr><td colspan="10" style="text-align: center;">등록된 판매 조건이 없습니다.</td></tr>';
                return;
            }

            productList.innerHTML = "";
            data.forEach(product => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${product.id}</td>
                    <td>${product.minHeadcount}</td>
                    <td>${product.maxHeadcount}</td>
                    <td>${product.minOrderAmount.toLocaleString()}원</td>
                    <td>${product.deliveryRadiusKm}km</td>
                    <td>${product.storeAddress}</td>
                    <td>${product.category}</td>
                    <td>${product.ratingAvg !== null ? product.ratingAvg.toFixed(1) : '-'}</td>
                    <td>${new Date(product.updatedAt).toLocaleString()}</td>
                    <td>
                        <a href="/products-update-test.html?id=${product.id}" class="btn">수정</a>
                    </td>
                `;
                productList.appendChild(tr);
            });
        } catch (error) {
            productList.innerHTML = `<tr><td colspan="10" style="text-align: center; color: red;">오류 발생: ${error.message}</td></tr>`;
        }
    }

    refreshBtn.addEventListener("click", fetchProducts);

    // 최초 로드 시 데이터 조회
    fetchProducts();
</script>

</body>
</html>
