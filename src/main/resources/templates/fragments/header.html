<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<body>

<!-- MatchEAT 각 페이지에서 공통으로 사용하는 상단 헤더 Fragment -->
<header th:fragment="header"
        class="site-header"
        data-auth-header>

    <div class="site-header-inner">

        <h1 class="site-logo">
            <a th:href="@{/}">
                MatchEAT
            </a>
        </h1>

        <nav class="site-nav"
             aria-label="주요 메뉴">

            <a th:href="@{/}"
               class="site-nav-link">
                홈
            </a>

            <a th:href="@{/product}"
               class="site-nav-link">
                상품
            </a>

            <a th:href="@{/requests}"
               class="site-nav-link">
                주문
            </a>

            <a th:href="@{/admin}"
               class="site-nav-link"
               data-admin-link
               hidden>
                관리자
            </a>

            <a th:href="@{/mypage}"
               class="site-nav-link"
               data-member-link
               hidden>
                마이페이지
            </a>

            <button type="button"
                    class="header-link"
                    data-logout-button
                    hidden>
                로그아웃
            </button>

            <a th:href="@{/login}"
               class="site-nav-link"
               data-guest-link>
                로그인
            </a>

            <a th:href="@{/signup}"
               class="site-nav-link site-nav-primary"
               data-guest-link>
                회원가입
            </a>

        </nav>

    </div>

    <script type="module"
            th:src="@{/account/js/auth-header.js}">
    </script>

</header>

</body>
</html>
