<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>맞춤 상품 매칭 | MatchEAT</title>

    <link rel="stylesheet"
          th:href="@{/css/common.css}">

    <link rel="stylesheet"
          th:href="@{/css/matching.css}">
</head>

<body>

<header th:replace="~{fragments/header :: header}">
</header>

<main id="matchingPage"
      class="matching-page"
      th:attr="data-request-id=${requestId}">

    <!-- 매칭 결과 페이지 제목 -->
    <section class="matching-header">

        <div>
            <h1>맞춤 상품 매칭</h1>

            <p>
                등록한 주문 조건을 기준으로
                거래 가능한 상품을 비교했습니다.
            </p>
        </div>

        <a th:href="@{/requests/{id}(id=${requestId})}"
           class="matching-back-link">
            주문 상세 보기
        </a>

    </section>

    <!-- 매칭에 사용된 주문 조건 -->
    <section class="matching-summary">

        <div class="matching-summary-item">
            <span>음식 카테고리</span>

            <strong th:text="${orderRequest.category}">
                중식
            </strong>
        </div>

        <div class="matching-summary-item">
            <span>희망 예산</span>

            <strong>
                <span th:text="${orderRequest.budgetType.name() == 'PER_PERSON'
                                ? '1인당'
                                : '총'}">
                    1인당
                </span>

                <span th:text="${#numbers.formatDecimal(
                                    orderRequest.budget,
                                    1,
                                    'COMMA',
                                    0,
                                    'POINT')}">
                    20000
                </span>원
            </strong>
        </div>

        <div class="matching-summary-item">
            <span>수량</span>

            <strong>
                <span th:text="${orderRequest.quantity}">
                    20
                </span>명
            </strong>
        </div>

        <div class="matching-summary-item matching-summary-address">
            <span>배송지</span>

            <strong th:text="${orderRequest.deliveryAddress}">
                서울특별시 강남구 테헤란로 152
            </strong>
        </div>

        <div class="matching-summary-item">
            <span>정렬 기준</span>

            <strong class="matching-sort-label">
                매칭 점수 높은 순
            </strong>
        </div>

    </section>

    <!-- API 조회 상태 -->
    <section id="matchingLoading"
             class="matching-message">
        매칭 가능한 상품을 확인하고 있습니다.
    </section>

    <section id="matchingError"
             class="matching-message matching-error"
             hidden>
    </section>

    <!-- 실제 매칭 결과 카드가 들어가는 영역 -->
    <section id="matchingResults"
             class="matching-results"
             hidden>
    </section>

</main>

<script type="module"
        th:src="@{/matching/js/matching-result.js}">
</script>

</body>
</html>
