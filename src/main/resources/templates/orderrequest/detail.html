<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문 상세 | MatchEAT</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/order.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main id="orderDetailPage" th:attr="data-request-id=${requestId}">
    <section class="order-detail-header">
        <div><h1>주문 상세</h1><p>등록된 주문의 상세 조건과 진행 상태를 확인할 수 있습니다.</p></div>
        <span id="orderStatus" class="order-status">조회 중</span>
    </section>

    <section id="orderLoading" class="order-detail-card"><p>주문 정보를 불러오고 있습니다.</p></section>
    <section id="orderError" class="order-detail-card" hidden><p></p></section>

    <div id="orderContent" hidden>
        <section class="order-detail-card">
            <h2>주문 기본 정보</h2>
            <div class="order-detail-info">
                <div class="order-detail-row"><span class="order-detail-label">주문 제목</span><span data-order-field="title"></span></div>
                <div class="order-detail-row"><span class="order-detail-label">행사/배송 일시</span><span data-order-field="eventDateTime"></span></div>
                <div class="order-detail-row"><span class="order-detail-label">수량</span><span><strong data-order-field="quantity"></strong>명</span></div>
                <div class="order-detail-row"><span class="order-detail-label">예산</span><span data-order-field="budget"></span></div>
                <div class="order-detail-row"><span class="order-detail-label">음식 카테고리</span><span data-order-field="category"></span></div>
                <div class="order-detail-row"><span class="order-detail-label">배송지</span><span data-order-field="deliveryAddress"></span></div>
            </div>
        </section>
        <section class="order-detail-card"><h2>상세 요청사항</h2><p class="order-detail-description" data-order-field="description"></p></section>
        <section class="order-detail-actions">
            <a th:href="@{/requests}" class="order-detail-back">목록으로</a>
            <div id="orderOwnerActions" class="order-detail-action-group" hidden>
                <a id="matchingLink" class="order-detail-button order-detail-match">매칭 결과 보기</a>
                <a id="editLink" class="order-detail-button order-detail-edit">주문 수정</a>
                <button type="button" id="cancelOrderButton" class="order-detail-button order-detail-cancel">주문 취소</button>
            </div>
            <div id="orderSellerActions" class="order-detail-action-group" hidden>
                <a id="proposalLink" class="order-detail-button order-detail-proposal">제안하기</a>
            </div>
        </section>
    </div>
</main>
<script type="module" th:src="@{/order/js/order-request-detail.js}"></script>
</body>
</html>
