<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문 요청 등록 | MatchEAT</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<!-- 주문 요청 정보를 입력받는 Thymeleaf 등록 페이지 -->
<header th:replace="~{fragments/header :: header}"></header>
<h1>주문 요청 등록</h1>

<form
        th:action="@{/requests}"
        th:object="${orderRequest}"
        method="post"
>

    <div>
        <label for="title">주문 요청 제목</label>
        <input type="text"
               id="title"
               th:field="*{title}"
               maxlength="100"
               required>
    </div>

    <div>
        <label for="description">상세 내용</label>
        <textarea id="description"
                  th:field="*{description}"
                  maxlength="1000"
                  rows="5"></textarea>
    </div>
    
    <div>
        <label for="eventDateTime">행사/배송 일시</label>
        <input
                type="datetime-local"
                id="eventDateTime"
                th:field="*{eventDateTime}"
                required
        >
    </div>

    <div>
        <label for="quantity">수량</label>
        <input
                type="number"
                id="quantity"
                th:field="*{quantity}"
                min="1"
                required
        >
    </div>

    <div>
        <label for="budgetType">예산 기준</label>
        <select
                id="budgetType"
                th:field="*{budgetType}"
                required
        >
            <option value="">선택해주세요</option>
            <option value="PER_PERSON">1인당 예산</option>
            <option value="TOTAL">총 예산</option>
        </select>
    </div>

    <div>
        <label for="budget">예산</label>
        <input
                type="number"
                id="budget"
                th:field="*{budget}"
                min="1"
                required
        >
    </div>

    <div>
        <label for="category">음식 카테고리</label>
        <input
                type="text"
                id="category"
                th:field="*{category}"
                required
        >
    </div>

    <div>
        <label for="deliveryAddress">배송지</label>
        <input
                type="text"
                id="deliveryAddress"
                th:field="*{deliveryAddress}"
                required
        >
    </div>

    <!-- 주소 검색 API 연동 전 임시 좌표값 -->
    <input type="hidden" name="latitude" value="37.5665">
    <input type="hidden" name="longitude" value="126.9780">

    <button type="submit">주문 요청 등록</button>

</form>
</body>
</html>
