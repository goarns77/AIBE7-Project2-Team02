<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문 목록 | MatchEAT</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/order.css}">
</head>

<body>

<!-- 전체 주문 정보를 조회해서 보여주는 Thymeleaf 목록 페이지 -->
<header th:replace="~{fragments/header :: header}"></header>

<main>

    <!-- 주문 목록 페이지의 제목과 주요 액션 영역 -->
    <section class="order-page-header">
        <div>
            <h1>주문 목록</h1>
            <p>등록된 주문의 조건과 진행 상태를 확인할 수 있습니다.</p>
        </div>

        <a th:href="@{/requests/new}" class="button">
            신규 주문 등록
        </a>
    </section>

    <!-- 주문 검색 영역 -->
    <section class="order-toolbar">
        <form th:action="@{/requests}"
              method="get"
              class="order-search-form">

            <input type="text"
                   name="keyword"
                   th:value="${keyword}"
                   placeholder="제목 또는 음식 카테고리 검색">

            <button type="submit">
                검색
            </button>
        </form>
    </section>

    <!-- 등록된 주문이 없는 경우 -->
    <p th:if="${#lists.isEmpty(orderRequests)
               and (keyword == null or keyword.isBlank())}">
        등록된 주문이 없습니다.
    </p>

    <!-- 검색 결과가 없는 경우 -->
    <p th:if="${#lists.isEmpty(orderRequests)
               and keyword != null
               and !keyword.isBlank()}">
        검색 결과가 없습니다.
    </p>

    <!-- 주문을 게시판형 카드 목록으로 표시하는 영역 -->
    <div class="order-list"
         th:unless="${#lists.isEmpty(orderRequests)}">

        <article class="order-item"
                 th:each="request : ${orderRequests}">

            <div class="order-item-main">

                <!-- 주문 상태와 제목 -->
                <div class="order-item-title">
<span class="order-status"
      th:text="${request.status.displayName}">
    매칭 중
</span>

                    <h2>
                        <a th:href="@{/requests/{id}(id=${request.id})}"
                           th:text="${#strings.isEmpty(request.title)
                                    ? '제목 없음'
                                    : request.title}">
                            주문 제목
                        </a>
                    </h2>
                </div>

                <!-- 주문 주요 조건 -->
                <div class="order-item-summary">

                    <div class="order-meta-item">
                        <span class="order-meta-label">카테고리</span>
                        <span class="order-meta-value"
                              th:text="${request.category}">
        한식
    </span>
                    </div>

                    <div class="order-meta-item">
                        <span class="order-meta-label">수량</span>
                        <span class="order-meta-value">
        <strong th:text="${request.quantity}">30</strong>명
    </span>
                    </div>

                    <div class="order-meta-item">
                        <span class="order-meta-label">예산</span>
                        <span class="order-meta-value">
        <span th:text="${request.budgetType.name() == 'PER_PERSON' ? '1인당' : '총'}">
            1인당
        </span>

        <strong th:text="${#numbers.formatDecimal(
                            request.budget,
                            1,
                            'COMMA',
                            0,
                            'POINT')}">
            18,000
        </strong>원
    </span>
                    </div>

                    <div class="order-meta-item">
                        <span class="order-meta-label">행사/배송 일시</span>
                        <span class="order-meta-value"
                              th:text="${#temporals.format(
                      request.eventDateTime,
                      'yyyy.MM.dd HH:mm')}">
        2026.10.02 12:00
    </span>
                    </div>

                    <!-- 정확한 배송지는 인증된 상세 API에서만 제공한다. -->
                    <div class="order-meta-item order-meta-address">
                        <span class="order-meta-label">
                            배송지
                        </span>

                        <span>로그인 후 상세 화면에서 확인</span>
                    </div>

                </div>
            </div>

            <!-- 주문 상세 페이지 이동 -->
            <div class="order-item-actions">
                <a th:href="@{/requests/{id}(id=${request.id})}">
                    상세 보기
                </a>
            </div>

        </article>

    </div>

</main>

</body>
</html>
