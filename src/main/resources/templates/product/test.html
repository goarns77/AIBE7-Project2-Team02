<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>판매 조건 등록 테스트</title>
</head>

<body>

<h1>판매 조건 등록 테스트</h1>

<div class="nav" style="margin-bottom: 20px;">
    <a href="/product/list" style="margin-right: 15px; text-decoration: none; color: #28a745; font-weight: bold;">📋 판매 조건 전체 목록 테스트 페이지로 이동</a>
    <a href="/product/update" style="margin-right: 15px; text-decoration: none; color: #28a745; font-weight: bold;">✏️ 판매 조건 수정 테스트 페이지로 이동</a>
</div>

<form id="productForm">

    <div>
        <label for="minHeadcount">최소 수주 수량</label>
        <input type="number" id="minHeadcount" min="1" required>
    </div>

    <div>
        <label for="maxHeadcount">최대 수주 수량</label>
        <input type="number" id="maxHeadcount" min="1" required>
    </div>

    <div>
        <label for="minOrderAmount">최소 주문 금액</label>
        <input type="number" id="minOrderAmount" min="1" required>
    </div>

    <div>
        <label for="deliveryRadiusKm">배송 가능 반경(km)</label>
        <input type="number" step="any" id="deliveryRadiusKm" min="0" required>
    </div>

    <div>
        <label for="storeAddress">가게 주소</label>
        <input type="text" id="storeAddress" required>
    </div>

    <div>
        <label for="category">음식 카테고리</label>
        <input type="text" id="category" required>
    </div>

    <div>
        <label for="description">설명</label>
        <textarea id="description" rows="4" placeholder="상품 설명을 입력하세요."></textarea>
    </div>

    <div>
        <label for="dayOfWeek">정기 휴무 요일</label>
        <select id="dayOfWeek">
            <option value="">없음</option>
            <option value="MONDAY">MONDAY</option>
            <option value="TUESDAY">TUESDAY</option>
            <option value="WEDNESDAY">WEDNESDAY</option>
            <option value="THURSDAY">THURSDAY</option>
            <option value="FRIDAY">FRIDAY</option>
            <option value="SATURDAY">SATURDAY</option>
            <option value="SUNDAY">SUNDAY</option>
        </select>
    </div>

    <div>
        <label for="unavailableDates">특정 불가 날짜</label>
        <textarea id="unavailableDates" rows="5" placeholder="예: 2026-08-29&#10;2026-09-02"></textarea>
        <small style="display: block; color: #6c757d;">여러 날짜는 줄바꿈 또는 쉼표로 입력할 수 있습니다.</small>
    </div>

    <div>
        <label for="imageFile">상품 이미지</label>
        <input type="file" id="imageFile" accept="image/*">
        <div style="margin-top: 10px;">
            <img id="imagePreview" alt="이미지 미리보기" style="display:none; width:160px; height:160px; object-fit:cover; border:1px solid #ddd; border-radius:8px;">
        </div>
    </div>

    <button type="submit">판매 조건 등록</button>

</form>

<h2>응답 결과</h2>
<pre id="result"></pre>

<script>
    const form = document.getElementById("productForm");
    const result = document.getElementById("result");
    const imageFileInput = document.getElementById("imageFile");
    const imagePreview = document.getElementById("imagePreview");

    function parseUnavailableDates(value) {
        return value
            .split(/[\n,]/)
            .map(date => date.trim())
            .filter(Boolean);
    }

    function updatePreview(file) {
        if (!file) {
            imagePreview.src = "";
            imagePreview.style.display = "none";
            return;
        }

        imagePreview.src = URL.createObjectURL(file);
        imagePreview.style.display = "block";
    }

    imageFileInput.addEventListener("change", () => {
        updatePreview(imageFileInput.files?.[0]);
    });

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const requestData = {
            minHeadcount: Number(document.getElementById("minHeadcount").value),
            maxHeadcount: Number(document.getElementById("maxHeadcount").value),
            minOrderAmount: Number(document.getElementById("minOrderAmount").value),
            deliveryRadiusKm: Number(document.getElementById("deliveryRadiusKm").value),
            storeAddress: document.getElementById("storeAddress").value,
            category: document.getElementById("category").value,
            description: document.getElementById("description").value,
            dayOfWeek: document.getElementById("dayOfWeek").value || null,
            unavailableDates: parseUnavailableDates(document.getElementById("unavailableDates").value)
        };

        const formData = new FormData();
        formData.append("product", new Blob([JSON.stringify(requestData)], { type: "application/json" }));

        const imageFile = imageFileInput.files?.[0];
        if (imageFile) {
            formData.append("imageFile", imageFile);
        }

        const response = await fetch("/api/v1/products", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        result.textContent = JSON.stringify(data, null, 2);
    });
</script>

</body>
</html>
