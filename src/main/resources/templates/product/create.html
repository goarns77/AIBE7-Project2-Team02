<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>판매 조건 등록 | MatchEAT</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/product.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main>
    <section class="product-form-header">
        <h1>새 판매 조건 등록</h1>
        <p>승인된 판매자만 등록할 수 있습니다. 주소를 입력하면 위경도가 자동으로 계산됩니다.</p>
    </section>

    <div class="product-toolbar">
        <a th:href="@{/product}">📋 판매 조건 목록</a>
        <a th:href="@{/product/update}">✏️ 판매 조건 수정</a>
    </div>

    <form id="productForm" class="product-form-card">

        <div class="product-form-row">
            <div class="product-form-field">
                <label for="productName">상품/메뉴명</label>
                <input type="text" id="productName" required>
            </div>

            <div class="product-form-field">
                <label for="category">음식 카테고리</label>
                <select id="category" required>
                    <option value="" disabled selected>선택하세요</option>
                    <option value="한식">한식</option>
                    <option value="중식">중식</option>
                    <option value="일식">일식</option>
                    <option value="양식">양식</option>
                    <option value="도시락/간편식">도시락/간편식</option>
                    <option value="디저트/다과">디저트/다과</option>
                    <option value="카페/음료">카페/음료</option>
                    <option value="비건">비건</option>
                    <option value="기타">기타</option>
                </select>
            </div>
        </div>

        <div class="product-form-row">
            <div class="product-form-field">
                <label for="minHeadcount">최소 수주 수량</label>
                <input type="number" id="minHeadcount" min="1" required>
            </div>

            <div class="product-form-field">
                <label for="maxHeadcount">최대 수주 수량</label>
                <input type="number" id="maxHeadcount" min="1" required>
            </div>
        </div>

        <div class="product-form-row">
            <div class="product-form-field">
                <label for="servingPrice">1인분 가격</label>
                <input type="number" id="servingPrice" min="1" required>
            </div>

            <div class="product-form-field">
                <label for="deliveryRadiusKm">배송 가능 반경(km)</label>
                <input type="number" step="any" id="deliveryRadiusKm" min="0" required>
            </div>
        </div>

        <div class="product-form-full">
            <label for="storeAddress">가게 주소</label>
            <input type="text" id="storeAddress" required>
        </div>

        <div class="product-form-full">
            <label for="description">설명</label>
            <textarea id="description" rows="4" placeholder="상품 설명을 입력하세요."></textarea>
        </div>

        <div class="product-form-row">
            <div class="product-form-field">
                <label for="dayOfWeek">정기 휴무 요일</label>
                <select id="dayOfWeek">
                    <option value="">없음</option>
                    <option value="MONDAY">월요일</option>
                    <option value="TUESDAY">화요일</option>
                    <option value="WEDNESDAY">수요일</option>
                    <option value="THURSDAY">목요일</option>
                    <option value="FRIDAY">금요일</option>
                    <option value="SATURDAY">토요일</option>
                    <option value="SUNDAY">일요일</option>
                </select>
            </div>

            <div class="product-form-field">
                <label for="imageFile">상품 이미지</label>
                <div class="product-image-upload">
                    <input type="file" id="imageFile" accept="image/*">
                    <img id="imagePreview" class="product-image-preview" alt="이미지 미리보기">
                </div>
            </div>
        </div>

        <div class="product-form-full">
            <label for="unavailableDates">특정 불가 날짜</label>
            <textarea id="unavailableDates" rows="3" placeholder="예: 2026-08-29&#10;2026-09-02"></textarea>
            <div class="product-form-hint">여러 날짜는 줄바꿈 또는 쉼표로 입력할 수 있습니다.</div>
        </div>

        <div class="product-form-actions">
            <a th:href="@{/product}" class="product-form-cancel">작성 취소</a>
            <button type="submit" class="product-form-submit">판매 조건 등록</button>
        </div>

        <div id="messageBox" class="product-form-message"></div>
    </form>

    <h2 style="margin-top: 24px;">응답 결과</h2>
    <pre id="result"></pre>
</main>

<script type="module" th:src="@{/product/js/product-create.js}"></script>
</body>
</html>
