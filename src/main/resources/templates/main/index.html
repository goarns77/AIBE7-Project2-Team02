<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>MatchEAT</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>

<body>

<!-- MatchEAT의 주요 기능과 진입 경로를 제공하는 메인 Thymeleaf 페이지 -->
<header th:replace="~{fragments/header::header}"></header>


<main>
    <!-- 메인 소개 영역 -->
    <section>
        <h2>조건에 맞는 주문을 찾아보세요</h2>

        <p>
            원하는 일정, 수량, 예산과 배송 조건을 입력하면
            조건에 맞는 상품과 판매자를 찾을 수 있습니다.
        </p>

        <a th:href="@{/requests/new}" class="button">
            주문 요청하기
        </a>
    </section>

    <!-- 매칭 결과 영역 -->
    <section>
        <h2>맞춤 매칭</h2>

        <p>
            주문 조건을 등록하면 조건에 맞는 상품과 판매자를 확인할 수 있습니다.
        </p>

        <!-- Matching 기능 구현 후 실제 데이터 연결 예정 -->
        <div>
            매칭 결과가 이곳에 표시됩니다.
        </div>
    </section>

    <!-- 인기 / 최근 상품 영역 -->
    <section>
        <h2>인기 상품</h2>

        <!-- Product 기능 구현 후 실제 데이터 연결 예정 -->
        <div>
            인기 상품이 이곳에 표시됩니다.
        </div>
    </section>

</main>

<footer>
    <p>MatchEAT</p>
</footer>

</body>
</html>
