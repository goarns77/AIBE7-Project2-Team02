<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>MatchEAT</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body>

<!-- MatchEAT의 주요 기능과 진입 경로를 제공하는 메인 Thymeleaf 페이지 -->
<header th:replace="~{fragments/header::header}"></header>

<main>
    <!-- 메인 소개 영역 -->
    <section>
        <h2>조건에 맞는 주문을 찾아보세요</h2>

        <p>
            원하는 일정, 수량, 예산과 배송 조건을 입력하면
            조건에 맞는 상품과 판매자를 찾을 수 있습니다.
        </p>

        <a th:href="@{/requests/new}" class="button">
            주문하기
        </a>
    </section>

    <!-- 맞춤 매칭 미리보기 영역 -->
    <section class="matching-preview-section">
        <h2>맞춤 매칭</h2>

        <p>
            최근 주문을 기준으로 조건에 잘 맞는 상품을 확인해보세요.
        </p>

        <p id="matchingPreviewContext"
           class="matching-preview-context"
           hidden>
        </p>

        <div id="matchingPreview"
             class="matching-preview">

            <div id="matchingPreviewLoading"
                 class="matching-preview-state">
                맞춤 매칭을 확인하고 있습니다.
            </div>

            <div id="matchingPreviewMessage"
                 class="matching-preview-state"
                 hidden>
            </div>

            <div id="matchingPreviewCards"
                 class="matching-preview-grid"
                 hidden>
            </div>

            <div id="matchingPreviewActions"
                 class="matching-preview-actions"
                 hidden>

                <a id="matchingAllLink"
                   class="button"
                   href="#">
                    전체 매칭 결과 보기
                </a>
            </div>
        </div>
    </section>

    <!-- 승인 판매자용 맞춤 주문 영역 -->
    <section id="sellerMatchingSection"
             class="matching-preview-section"
             hidden>

        <h2>판매자 맞춤 주문</h2>

        <p>
            판매 조건에 잘 맞는 주문을 확인해보세요.
        </p>

        <div class="matching-preview-state">
            판매자 맞춤 주문 추천은 준비 중입니다.
        </div>

    </section>

    <!-- 인기 / 최근 상품 영역 -->
    <section class="product-preview-section">
        <h2>인기 / 최근 상품</h2>

        <p>
            현재 등록된 상품을 둘러보세요.
        </p>

        <div id="productPreviewLoading"
             class="matching-preview-state">
            상품을 불러오고 있습니다.
        </div>

        <div id="productPreviewMessage"
             class="matching-preview-state"
             hidden>
        </div>

        <div id="productPreviewCards"
             class="matching-preview-grid"
             hidden>
        </div>

        <div id="productPreviewActions"
             class="matching-preview-actions"
             hidden>

            <a th:href="@{/product/list}"
               class="button">
                전체 상품 보기
            </a>
        </div>
    </section>

</main>

<footer>
    <p>MatchEAT</p>
</footer>

<script type="module"
        th:src="@{/main/js/main.js}">
</script>

</body>
</html>
