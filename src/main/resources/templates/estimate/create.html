<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>견적 작성</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; background: #fafafa; color: #1f2937; }
        .page { max-width: 920px; margin: 0 auto; }
        .nav a { margin-right: 14px; text-decoration: none; color: #2563eb; font-weight: 700; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 20px; box-shadow: 0 8px 28px rgba(15, 23, 42, 0.05); }
        .field { margin-bottom: 14px; }
        label { display: block; font-weight: 700; margin-bottom: 6px; }
        input, select, textarea { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px; border: 1px solid #cbd5e1; font: inherit; }
        textarea { min-height: 120px; resize: vertical; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
        .btn { padding: 10px 14px; border-radius: 10px; border: 0; cursor: pointer; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-secondary { background: #e2e8f0; color: #0f172a; }
        pre { background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 12px; overflow: auto; }
        .hint { font-size: 12px; color: #64748b; margin-top: 4px; }
        .notice { background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; display: none; }
    </style>
</head>
<body>
<div class="page">
    <div class="nav">
        <a href="/estimates">목록</a>
        <a href="/product">상품 목록</a>
    </div>

    <div class="card">
        <h1 style="margin-top:0;">견적 작성</h1>
        <p style="color:#64748b;">원하는 판매자에게 견적을 요청합니다. 아래 내용을 직접 입력해주세요.</p>

        <div id="missingSellerNotice" class="notice">
            판매자 정보가 없습니다. 상품 상세 페이지에서 "견적 요청하기" 버튼으로 들어와주세요.
        </div>

        <form id="estimateForm">
            <div class="field">
                <label for="itemName">상품명</label>
                <input type="text" id="itemName" placeholder="예: 한우 도시락" required>
            </div>

            <div class="field">
                <label for="eventDateTime">행사/이용 일시</label>
                <input type="datetime-local" id="eventDateTime" required>
            </div>

            <div class="field">
                <label for="budgetType">예산 유형</label>
                <select id="budgetType" required>
                    <option value="">선택</option>
                    <option value="PER_PERSON">1인당 예산</option>
                    <option value="TOTAL">총 예산</option>
                </select>
            </div>

            <div class="field">
                <label for="budget">예산</label>
                <input type="number" id="budget" min="0" step="0.01" placeholder="예: 50000" required>
            </div>

            <div class="field">
                <label for="quantity">수량(인분)</label>
                <input type="number" id="quantity" min="1" step="1" placeholder="예: 20" required>
                <div class="hint">예산 유형이 "총 예산"이면 이 수량으로 1인당 금액을 계산합니다.</div>
            </div>

            <div class="field">
                <label for="deliveryAddress">배송(행사) 주소</label>
                <input type="text" id="deliveryAddress" placeholder="예: 서울특별시 강남구 테헤란로 152" required>
                <div class="hint">주소를 입력하면 위경도가 자동으로 계산됩니다.</div>
            </div>

            <div class="field">
                <label for="description">상세 설명</label>
                <textarea id="description" placeholder="요청 사항, 전달할 내용을 적어주세요."></textarea>
            </div>

            <div class="field">
                <label for="estimateImage">견적 이미지</label>
                <input type="text" id="estimateImage" placeholder="이미지 URL 또는 경로">
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary">견적 요청 보내기</button>
                <a class="btn btn-secondary" href="/estimates">취소</a>
            </div>
        </form>
    </div>

    <h2>응답 결과</h2>
    <pre id="result">아직 저장하지 않았습니다.</pre>
</div>

<script type="module">
    import { authFetch, readApiBody, readCurrentUserId } from "/account/js/auth-client.js";

    const estimateForm = document.getElementById("estimateForm");
    const result = document.getElementById("result");
    const missingSellerNotice = document.getElementById("missingSellerNotice");

    if (readCurrentUserId() === null) {
        const redirect = encodeURIComponent(window.location.pathname + window.location.search);
        window.location.href = `/login?redirect=${redirect}`;
    }

    // 상품 상세 페이지에서 넘어온 값. 화면에는 표시하지 않고 폼 제출에만 사용한다.
    const params = new URLSearchParams(window.location.search);
    const sellerId = params.get("sellerId") ? Number(params.get("sellerId")) : null;
    const productId = params.get("productId") ? Number(params.get("productId")) : null;
    const itemName = params.get("itemName");

    if (!sellerId) {
        missingSellerNotice.style.display = "block";
        estimateForm.querySelector("button[type=submit]").disabled = true;
    }

    if (itemName) {
        document.getElementById("itemName").value = itemName;
    }

    estimateForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!sellerId) {
            result.textContent = "판매자 정보가 없어 견적을 요청할 수 없습니다.";
            return;
        }

        const requestData = {
            description: document.getElementById("description").value || null,
            budget: Number(document.getElementById("budget").value),
            budgetType: document.getElementById("budgetType").value,
            itemName: document.getElementById("itemName").value,
            quantity: Number(document.getElementById("quantity").value),
            eventDateTime: document.getElementById("eventDateTime").value,
            sellerId: sellerId,
            productId: productId,
            deliveryAddress: document.getElementById("deliveryAddress").value,
            estimateImage: document.getElementById("estimateImage").value || null
        };

        try {
            result.textContent = "전송 중...";
            const response = await authFetch("/api/v1/estimates", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestData)
            });

            const data = await readApiBody(response);
            if (!response.ok) {
                throw new Error(data?.message ?? "견적 저장에 실패했습니다.");
            }

            alert("견적 요청이 정상적으로 작성되었습니다.");
            window.location.href = "/";
        } catch (error) {
            result.textContent = error.message;
        }
    });
</script>
</body>
</html>
