<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>견적 작성</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; background: #fafafa; color: #1f2937; }
        .page { max-width: 920px; margin: 0 auto; }
        .nav a { margin-right: 14px; text-decoration: none; color: #2563eb; font-weight: 700; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 20px; box-shadow: 0 8px 28px rgba(15, 23, 42, 0.05); }
        .field { margin-bottom: 14px; }
        label { display: block; font-weight: 700; margin-bottom: 6px; }
        input, select, textarea { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px; border: 1px solid #cbd5e1; font: inherit; }
        textarea { min-height: 120px; resize: vertical; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
        .btn { padding: 10px 14px; border-radius: 10px; border: 0; cursor: pointer; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-secondary { background: #e2e8f0; color: #0f172a; }
        pre { background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 12px; overflow: auto; }
        .hint { font-size: 12px; color: #64748b; margin-top: 4px; }
    </style>
</head>
<body>
<div class="page">
    <div class="nav">
        <a href="/estimates">목록</a>
        <a href="/product">상품 목록</a>
    </div>

    <div class="card">
        <h1 style="margin-top:0;">견적 작성</h1>
        <p style="color:#64748b;">구매 조건을 직접 입력하거나 주문 요청 정보를 기준으로 작성할 수 있습니다.</p>

        <form id="estimateForm">
            <div class="field">
                <label for="orderId">주문 요청 ID</label>
                <input type="number" id="orderId" min="1" placeholder="필수" required>
                <div class="hint">이 견적 요청이 근거로 삼을 내 주문 요청 ID입니다. (필수)</div>
            </div>

            <div class="field">
                <label for="sellerId">판매자 ID</label>
                <input type="number" id="sellerId" min="1" placeholder="필수" required>
            </div>

            <div class="field">
                <label for="productId">상품 ID</label>
                <input type="number" id="productId" min="1" placeholder="선택">
                <div class="hint">등록된 상품을 근거로 요청하는 경우에만 입력하세요.</div>
            </div>

            <div class="field">
                <label for="itemName">상품명</label>
                <input type="text" id="itemName" placeholder="예: 한우 도시락">
            </div>

            <div class="field">
                <label for="eventDateTime">행사/이용 일시</label>
                <input type="datetime-local" id="eventDateTime">
            </div>

            <div class="field">
                <label for="budgetType">예산 유형</label>
                <select id="budgetType">
                    <option value="">선택</option>
                    <option value="PER_PERSON">1인당 예산</option>
                    <option value="TOTAL">총 예산</option>
                </select>
            </div>

            <div class="field">
                <label for="budget">예산</label>
                <input type="number" id="budget" min="0" step="0.01" placeholder="예: 50000">
            </div>

            <div class="field">
                <label for="description">상세 설명</label>
                <textarea id="description" placeholder="주문 조건, 요청 사항, 전달할 내용을 적어주세요."></textarea>
            </div>

            <div class="field">
                <label for="estimateImage">견적 이미지</label>
                <input type="text" id="estimateImage" placeholder="이미지 URL 또는 경로">
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary">견적 저장</button>
                <a class="btn btn-secondary" href="/estimates">취소</a>
            </div>
        </form>
    </div>

    <h2>응답 결과</h2>
    <pre id="result">아직 저장하지 않았습니다.</pre>
</div>

<script>
    const estimateForm = document.getElementById("estimateForm");
    const result = document.getElementById("result");
    const ACCESS_TOKEN_KEY = "matcheat.accessToken";

    function readAccessToken() {
        return sessionStorage.getItem(ACCESS_TOKEN_KEY);
    }

    async function authFetch(url, options = {}) {
        const headers = new Headers(options.headers || {});
        const token = readAccessToken();
        if (token) {
            headers.set("Authorization", `Bearer ${token}`);
        }
        return fetch(url, { ...options, headers });
    }

    function toLocalDateTimeValue(value) {
        if (!value) {
            return "";
        }

        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
            return "";
        }

        const pad = (n) => String(n).padStart(2, "0");
        return [
            date.getFullYear(),
            pad(date.getMonth() + 1),
            pad(date.getDate())
        ].join("-") + `T${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    function applyQueryDefaults() {
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get("orderId");
        const sellerId = params.get("sellerId");
        const productId = params.get("productId");
        const itemName = params.get("itemName");
        const eventDateTime = params.get("eventDateTime");

        if (orderId) document.getElementById("orderId").value = orderId;
        if (sellerId) document.getElementById("sellerId").value = sellerId;
        if (productId) document.getElementById("productId").value = productId;
        if (itemName) document.getElementById("itemName").value = itemName;
        if (eventDateTime) document.getElementById("eventDateTime").value = toLocalDateTimeValue(eventDateTime);
    }

    estimateForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const requestId = document.getElementById("orderId").value;
        if (!requestId) {
            result.textContent = "주문 요청 ID는 필수입니다.";
            return;
        }

        const requestData = {
            description: document.getElementById("description").value || null,
            budget: document.getElementById("budget").value ? Number(document.getElementById("budget").value) : null,
            budgetType: document.getElementById("budgetType").value || null,
            itemName: document.getElementById("itemName").value || null,
            eventDateTime: document.getElementById("eventDateTime").value || null,
            sellerId: document.getElementById("sellerId").value ? Number(document.getElementById("sellerId").value) : null,
            productId: document.getElementById("productId").value ? Number(document.getElementById("productId").value) : null,
            estimateImage: document.getElementById("estimateImage").value || null
        };

        try {
            result.textContent = "전송 중...";
            const response = await authFetch(`/api/v1/requests/${Number(requestId)}/estimates`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestData)
            });

            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error(data.message || "견적 저장에 실패했습니다.");
            }

            result.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
            result.textContent = error.message;
        }
    });

    applyQueryDefaults();
</script>
</body>
</html>
