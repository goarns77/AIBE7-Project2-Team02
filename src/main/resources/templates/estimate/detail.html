<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>견적 상세</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; background: #fafafa; color: #1f2937; }
        .page { max-width: 960px; margin: 0 auto; }
        .nav a { margin-right: 14px; text-decoration: none; color: #2563eb; font-weight: 700; }
        .hero, .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 20px; box-shadow: 0 8px 28px rgba(15, 23, 42, 0.05); }
        .hero { margin: 18px 0; }
        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 14px; }
        .label { display: block; font-size: 12px; color: #64748b; margin-bottom: 4px; }
        .value { font-weight: 700; word-break: break-word; }
        .wide { grid-column: 1 / -1; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
        .btn { padding: 10px 14px; border-radius: 10px; text-decoration: none; font-weight: 700; border: 1px solid transparent; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-secondary { background: #fff; color: #334155; border-color: #cbd5e1; }
    </style>
</head>
<body>
<div class="page">
    <div class="nav">
        <a href="/estimates">목록</a>
        <a href="/estimates/new">새 작성</a>
    </div>

    <section class="hero">
        <h1 id="title" style="margin:0 0 8px;">견적 상세</h1>
        <p style="margin:0; color:#64748b;">견적 요청의 세부 조건을 확인하고 수정으로 이동할 수 있습니다.</p>
    </section>

    <div class="card" id="loadingBox">상세 정보를 불러오는 중입니다...</div>

    <section class="card" id="detailBox" style="display:none;">
        <div class="grid">
            <div class="item">
                <span class="label">견적 ID</span>
                <span class="value" id="id"></span>
            </div>
            <div class="item">
                <span class="label">작성일</span>
                <span class="value" id="createdAt"></span>
            </div>
            <div class="item wide">
                <span class="label">상품명</span>
                <span class="value" id="itemName"></span>
            </div>
            <div class="item wide">
                <span class="label">상세 설명</span>
                <span class="value" id="description"></span>
            </div>
            <div class="item">
                <span class="label">예산</span>
                <span class="value" id="budget"></span>
            </div>
            <div class="item">
                <span class="label">예산 유형</span>
                <span class="value" id="budgetType"></span>
            </div>
            <div class="item">
                <span class="label">행사 일시</span>
                <span class="value" id="eventDateTime"></span>
            </div>
            <div class="item">
                <span class="label">판매자 ID</span>
                <span class="value" id="sellerId"></span>
            </div>
            <div class="item">
                <span class="label">주문 요청 ID</span>
                <span class="value" id="orderId"></span>
            </div>
            <div class="item wide">
                <span class="label">견적 이미지</span>
                <span class="value" id="estimateImage"></span>
            </div>
        </div>

        <div class="actions">
            <a class="btn btn-secondary" href="/estimates">목록으로</a>
        </div>
    </section>
</div>

<script>
    const loadingBox = document.getElementById("loadingBox");
    const detailBox = document.getElementById("detailBox");
    const ACCESS_TOKEN_KEY = "matcheat.accessToken";

    function readAccessToken() {
        return sessionStorage.getItem(ACCESS_TOKEN_KEY);
    }

    async function authFetch(url, options = {}) {
        const headers = new Headers(options.headers || {});
        const token = readAccessToken();
        if (token) {
            headers.set("Authorization", `Bearer ${token}`);
        }
        return fetch(url, { ...options, headers });
    }

    function getId() {
        const match = window.location.pathname.match(/\/estimates\/(\d+)/);
        return match ? match[1] : null;
    }

    function formatMoney(value) {
        return value != null ? `${Number(value).toLocaleString()}원` : "-";
    }

    function formatDateTime(value) {
        return value ? new Date(value).toLocaleString() : "-";
    }

    async function loadDetail() {
        const id = getId();
        if (!id) {
            loadingBox.textContent = "유효한 견적 ID가 없습니다.";
            return;
        }

        try {
            const response = await authFetch(`/api/v1/estimates/${id}`);
            if (!response.ok) {
                throw new Error("견적 상세를 불러오지 못했습니다.");
            }

            const item = await response.json();
            document.getElementById("title").textContent = `견적 #${item.id}`;
            document.getElementById("id").textContent = item.id ?? "-";
            document.getElementById("createdAt").textContent = formatDateTime(item.createdAt);
            document.getElementById("itemName").textContent = item.itemName ?? "-";
            document.getElementById("description").textContent = item.description ?? "-";
            document.getElementById("budget").textContent = formatMoney(item.budget);
            document.getElementById("budgetType").textContent = item.budgetType ?? "-";
            document.getElementById("eventDateTime").textContent = formatDateTime(item.eventDateTime);
            document.getElementById("sellerId").textContent = item.sellerId ?? "-";
            document.getElementById("orderId").textContent = item.requestId ?? "-";
            document.getElementById("estimateImage").textContent = item.estimateImage ?? "-";

            loadingBox.style.display = "none";
            detailBox.style.display = "block";
        } catch (error) {
            loadingBox.textContent = error.message;
        }
    }

    loadDetail();
</script>
</body>
</html>
