<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>견적 목록</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; background: #fafafa; color: #1f2937; }
        .page { max-width: 1200px; margin: 0 auto; }
        .nav a { margin-right: 14px; text-decoration: none; color: #2563eb; font-weight: 700; }
        .hero { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 20px; margin: 18px 0; }
        .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 14px; border-radius: 10px; text-decoration: none; font-weight: 700; border: 1px solid transparent; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-secondary { background: #fff; color: #334155; border-color: #cbd5e1; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 14px; overflow: hidden; border: 1px solid #e5e7eb; }
        th, td { padding: 12px; border-bottom: 1px solid #e5e7eb; text-align: left; vertical-align: top; }
        th { background: #f8fafc; font-size: 13px; color: #475569; }
        .empty { text-align: center; color: #6b7280; }
        .muted { color: #6b7280; font-size: 13px; }
    </style>
</head>
<body>
<div class="page">
    <div class="nav">
        <a href="/product">상품 목록</a>
        <a href="/estimates/new">견적 작성</a>
    </div>

    <section class="hero">
        <h1 style="margin:0 0 8px;">내 견적</h1>
        <p style="margin:0; color:#64748b;">내가 보낸 견적 요청과 내가 받은 견적 요청을 확인합니다.</p>
    </section>

    <div class="toolbar">
        <a class="btn btn-primary" href="/estimates/new">새 견적 작성</a>
        <a class="btn btn-secondary" href="#" id="refreshBtn">새로고침</a>
    </div>

    <h2 style="margin:24px 0 10px;">📤 내가 보낸 견적 요청</h2>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>상품명</th>
            <th>예산</th>
            <th>예산 유형</th>
            <th>행사 일시</th>
            <th>상태</th>
            <th>작성일</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody id="sentList">
        <tr><td colspan="8" class="empty">불러오는 중...</td></tr>
        </tbody>
    </table>

    <h2 style="margin:32px 0 10px;">📥 내가 받은 견적 요청</h2>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>상품명</th>
            <th>예산</th>
            <th>예산 유형</th>
            <th>행사 일시</th>
            <th>상태</th>
            <th>작성일</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody id="receivedList">
        <tr><td colspan="8" class="empty">불러오는 중...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const sentList = document.getElementById("sentList");
    const receivedList = document.getElementById("receivedList");
    const refreshBtn = document.getElementById("refreshBtn");
    const ACCESS_TOKEN_KEY = "matcheat.accessToken";

    function readAccessToken() {
        return sessionStorage.getItem(ACCESS_TOKEN_KEY);
    }

    async function authFetch(url, options = {}) {
        const headers = new Headers(options.headers || {});
        const token = readAccessToken();
        if (token) {
            headers.set("Authorization", `Bearer ${token}`);
        }
        return fetch(url, { ...options, headers });
    }

    function formatMoney(value) {
        return value != null ? `${Number(value).toLocaleString()}원` : "-";
    }

    function formatDateTime(value) {
        return value ? new Date(value).toLocaleString() : "-";
    }

    const STATUS_LABELS = {
        REQUESTED: "요청됨",
        ACCEPTED: "수락됨",
        REJECTED: "거절됨",
        CANCELED: "취소됨"
    };

    function formatStatus(value) {
        return STATUS_LABELS[value] ?? value ?? "-";
    }

    function renderSentRows(items) {
        if (!items.length) {
            sentList.innerHTML = '<tr><td colspan="8" class="empty">보낸 견적 요청이 없습니다.</td></tr>';
            return;
        }

        sentList.innerHTML = "";
        items.forEach(item => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${item.id}</td>
                <td>
                    <div>${item.itemName ?? "-"}</div>
                    <div class="muted">${item.description ?? "-"}</div>
                </td>
                <td>${formatMoney(item.budget)}</td>
                <td>${item.budgetType ?? "-"}</td>
                <td>${formatDateTime(item.eventDateTime)}</td>
                <td>${formatStatus(item.status)}</td>
                <td>${formatDateTime(item.createdAt)}</td>
                <td><a class="btn btn-secondary" href="/estimates/${item.id}">상세</a></td>
            `;
            sentList.appendChild(tr);
        });
    }

    function renderReceivedRows(items) {
        if (!items.length) {
            receivedList.innerHTML = '<tr><td colspan="8" class="empty">받은 견적 요청이 없습니다.</td></tr>';
            return;
        }

        receivedList.innerHTML = "";
        items.forEach(item => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${item.id}</td>
                <td>
                    <div>${item.itemName ?? "-"}</div>
                    <div class="muted">${item.description ?? "-"}</div>
                </td>
                <td>${formatMoney(item.budget)}</td>
                <td>${item.budgetType ?? "-"}</td>
                <td>${formatDateTime(item.eventDateTime)}</td>
                <td>${formatStatus(item.status)}</td>
                <td>${formatDateTime(item.createdAt)}</td>
                <td><a class="btn btn-secondary" href="/estimates/${item.id}">상세</a></td>
            `;
            receivedList.appendChild(tr);
        });
    }

    async function fetchSection(url, onSuccess, onErrorTarget, colspan) {
        try {
            const response = await authFetch(url);
            if (!response.ok) {
                throw new Error("목록을 불러오지 못했습니다.");
            }
            onSuccess(await response.json());
        } catch (error) {
            onErrorTarget.innerHTML = `<tr><td colspan="${colspan}" class="empty">${error.message}</td></tr>`;
        }
    }

    async function fetchEstimates() {
        sentList.innerHTML = '<tr><td colspan="8" class="empty">불러오는 중...</td></tr>';
        receivedList.innerHTML = '<tr><td colspan="8" class="empty">불러오는 중...</td></tr>';

        await Promise.all([
            fetchSection("/api/v1/estimates/sent", renderSentRows, sentList, 8),
            fetchSection("/api/v1/estimates/received", renderReceivedRows, receivedList, 8)
        ]);
    }

    refreshBtn.addEventListener("click", (event) => {
        event.preventDefault();
        fetchEstimates();
    });

    fetchEstimates();
</script>
</body>
</html>
